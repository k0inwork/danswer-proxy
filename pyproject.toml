[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danswer-proxy"
version = "1.0.0"
description = "OpenAI-compatible API proxy in front of an Onyx / Danswer suite, with workspace file sync"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "flask>=2.2",
    "requests>=2.28",
]

[project.scripts]
danswer-proxy = "app:main"

[tool.setuptools]
packages = ["orchestrator"]
py-modules = ["app"]
